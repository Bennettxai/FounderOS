<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="BusinessOS" />
		<meta property="og:title" content="BusinessOS — Your First Self-Learning Business OS" />
		<meta property="og:description" content="Proactive AI agents, a cloud computer, and a self-evolving platform that runs your entire business. Open source. Bring your own keys." />
		<meta property="og:image" content="https://businessos.dev/og-image.jpg" />
		<meta property="og:image:type" content="image/jpeg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:url" content="https://businessos.dev" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="BusinessOS — Your First Self-Learning Business OS" />
		<meta name="twitter:description" content="Proactive AI agents, a cloud computer, and a self-evolving platform that runs your entire business. Open source. Bring your own keys." />
		<meta name="twitter:image" content="https://businessos.dev/og-image.jpg" />

		<!-- The operator: Monolith Signal before first paint of /os only (src/lib/founderos/theme) -->
		<script>(function(){var p=location.pathname;if(p!=='/os'&&p.indexOf('/os/')!==0)return;var k=["mono","mono-light","terminal","light","midnight","ember"],l=["mono-light","light"],t;try{t=localStorage.getItem('founderos-theme')}catch(e){}if(t==='dark')t='terminal';if(k.indexOf(t)<0)t='mono';var r=document.documentElement;r.setAttribute('data-founderos-theme',t);if(l.indexOf(t)<0)r.classList.add('dark');else r.classList.remove('dark');})();</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
